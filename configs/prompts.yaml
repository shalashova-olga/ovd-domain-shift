# Варианты текстового запроса для проверки чувствительности к формулировке.
#
# Аналог «чувствительности к формулировке инструкции» из текстовых LLM-задач.
# Для open-vocabulary детекторов это не формальность: текстовый энкодер даёт
# разные эмбеддинги для 'car' и 'a photo of a car', и расхождение mAP между
# вариантами у отдельных моделей сопоставимо с разницей между самими моделями.
# Без этого замера любое ранжирование моделей недоказуемо.
#
# {cls} подставляется именем класса из ACDC_CLASSES.

variants:
  # Голое имя класса — минимальный запрос, рекомендованный авторами
  # Grounding DINO и YOLO-World.
  plain: "{cls}"

  # Неопределённый артикль — формат, на котором обучался CLIP-энкодер
  # в OWL-ViT/OWLv2.
  article: "a {cls}"

  # Развёрнутый контекстный шаблон. Проверяет, помогает ли контекст сцены
  # при сдвиге домена или, наоборот, уводит внимание текстового энкодера.
  contextual: "a photo of a {cls} on a road"

# Класс rider отсутствует в словаре COCO и плохо выражается одним словом.
# Переопределение фиксируется явно, чтобы разница в его AP между моделями
# не объяснялась случайным выбором формулировки.
class_overrides:
  rider:
    plain: "rider"
    article: "a rider"
    contextual: "a person riding a bicycle or motorcycle"
